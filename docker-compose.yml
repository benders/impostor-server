version: '3.4'

services:
  impostor:
    image: aeonlucid/impostor:nightly
    restart: unless-stopped
    container_name: impostor
    ports:
      - 22023:22023/udp
    expose:
      - "8080"
    environment:
      - IMPOSTOR_Server__PublicIp=${PUBLIC_HOST}
    volumes:
      - ./config.json:/app/config.json
      - ./plugins:/app/plugins
      # - /path/to/local/libraries:/app/libraries     # Only needed if using external libraries (some plugins may need this)
    networks:
      - game-net

  caddy:
    # Need to build image manually until caddy-dns/cloudflare#123
    #   is merged
    # image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    container_name: caddy
    ports:
      - 22023:22023/tcp
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - game-net

networks:
  game-net:

volumes:
  caddy_data:
  caddy_config:
